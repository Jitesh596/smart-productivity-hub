<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Productivity Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script defer src="script.js"></script>
</head>

<body>

<nav>
  <h2>🚀 Smart Hub</h2>
  <div>
    <a href="#weather">Weather</a>
    <a href="#events">Events</a>
    <a href="#todo">To-Do</a>
    <button id="themeToggle">🌙</button>
  </div>
</nav>

<!-- WEATHER -->
<section id="weather">
  <h1>⛅ Weather Tracker</h1>

  <form id="weather-form">
    <input type="text" id="city" placeholder="Enter city" required>
    <button>Search</button>
  </form>

  <button id="autoLocation">📍 Use My Location</button>

  <div id="weatherBox" class="glass"></div>
</section>

<!-- EVENTS -->
<section id="events">
  <h1>🎉 Event Dashboard</h1>

  <form class="form">
    <input type="text" id="eventTitle" placeholder="Title" required>
    <input type="date" id="eventDate" required>
    <textarea id="description" placeholder="Description"></textarea>
    <button>Add Event</button>
  </form>

  <input type="text" id="searchEvent" placeholder="Search events">

  <div class="controls">
    <button class="clearall">Clear All</button>
  </div>

  <div class="cards"></div>
</section>

<!-- TODO -->
<section id="todo">
  <h1>✅ To-Do List</h1>

  <form id="todoForm">
    <input type="text" id="taskInput" placeholder="Enter task" required>
    <button>Add Task</button>
  </form>

  <ul id="taskList"></ul>
</section>

</body>
</html>
